# Whether to enable TransferQueue. TaskRunnerV1 enables it before initialization.
enable: false

# Pluggable storage and transport backend.
backend:

  # In-memory ZMQ storage is the portable default.
  storage_backend: SimpleStorage

  # SimpleStorage settings.
  SimpleStorage:

    # Null means no explicit queue capacity limit.
    total_storage_size: null

    # Distribute queue storage across these Ray actors.
    num_data_storage_units: 8

    # Optional local SSD offload.
    ssd_offload:
      enabled: false
      path: null
      threshold_bytes: 1048576
